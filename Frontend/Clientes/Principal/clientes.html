<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INT-SOLUTIONS Control de Equipos</title>
  <link rel="stylesheet" href="./clientes.css">
  <link rel="icon" type="image/png" href="/Imagenes/logo.png"> 
</head>
<body>
  <!-- Título y logo -->
  <div class="cabeza">
    <img class="Logo" src="/Imagenes/logo.png" alt="LOGO-INT">
    <div class="Titulo">INT-SOLUTIONS</div>
  </div>
  
  <!-- Subtítulo y botones -->
  <div class="header-container">
    <div class="Subtitulo">Clientes</div>
    <div class="botones-container">
      <a href="../Crear-Clientes/crear-cliente.html"><button class="Crear">Crear</button></a>
      <a href="../Buscar/Buscar.html"><button class="Buscar">Buscar</button></a>
      <a href="/menu/menu.html"><button class="Salir">Volver</button></a>

    </div>
  </div>
  <!-- Opción de mostrar todos o por páginas -->
<div class="opcion-paginacion">
    <label for="mostrarOpciones">Ver clientes:</label>
    <select id="mostrarOpciones">
        <option value="pagina">Por Páginas</option>
        <option value="todos">Ver Todos</option>
    </select>
</div>

  <!-- Contenedor de clientes -->
  <div class="container">
    <div id="contenedorDatos" class="datos-container"></div>
  </div>
  
  <!-- Contenedor de paginación -->
  <div class="Botones_pg" id="pagination"></div>
  
  <script src="clientes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INT-SOLUTIONS Control de Equipos</title>
  <link rel="stylesheet" href="pagos-buscar.css">
  <link rel="icon" type="image/png" href="/Imagenes/logo.png">
</head>
<body>
  <!-- Título y logo -->
  <div class="cabeza">
    <img class="Logo" src="/Imagenes/logo.png" alt="LOGO-INT">
    <div class="Titulo">INT-SOLUTIONS</div>
  </div>
  
  <!-- Subtítulo y botones -->
  <div class="header-container">
    <div class="Subtitulo">Búsqueda Pagos</div>
    <div class="botones-container">
      <a href="../Principal/pagos-index.html"><button class="Salir">Volver</button></a>
    </div>
  </div>
  
  <div class="cuerpo">
    <!-- Botón para búsqueda por ID (botón Cédula eliminado) -->
    <div class="BotonesPrincipales">
      <button type="button" class="ID active" id="btnID">ID</button>
    </div>
    
    <!-- Formulario para búsqueda -->
    <div class="CampoBuscar">
      <form id="CampoBuscar1">
        <div class="input-container">
          <input type="text" placeholder="Llenar campo" required>
          <button type="submit">Buscar</button>
        </div>
      </form>
    </div>

    <!-- Contenedor para resultados de búsqueda -->
    <div class="result-container">
      <!-- Aquí se mostrarán los resultados de la búsqueda -->
    </div>
    
    <!-- Botones para borrar y actualizar -->
    <div class="action-buttons">
      <button class="Borrar" id="btnBorrar">Borrar</button>
      <button class="Actualizar" id="btnActualizar">Actualizar</button>
    </div>
  </div>
  
  <!-- Modal de confirmación -->
  <div id="modalConfirm" class="modal hidden">
    <div class="modal-content">
      <p>¿Está seguro de eliminar este registro?</p>
      <div class="modal-buttons">
        <button id="confirmYes">Sí</button>
        <button id="confirmNo">Cancelar</button>
      </div>
    </div>
  </div>
  
  <script src="pagos-buscar.js"></script>
</body>
</html>

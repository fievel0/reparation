<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INT-SOLUTIONS Control de Equipos</title>
  <link rel="stylesheet" href="crear-empleados.css">
  <link rel="icon" type="image/png" href="/Imagenes/logo.png"> 
</head>
<body>
  <!-- Título y logo -->
  <div class="cabeza">
    <img class="Logo" src="/Imagenes/logo.png" alt="LOGO-INT">
    <div class="Titulo">INT-SOLUTIONS</div>
  </div>
  
  <!-- Subtítulo y botones -->
  <div class="header-container">
    <div class="Subtitulo">Nuevo Empleado</div>
    <div class="botones-container">
      <a href="../Principal-Empleados/empleados.html"><button class="Salir">Volver</button></a>
    </div>
  </div>
  
  <!-- Formulario para nuevo empleado -->
  <div class="form-container">
    <form id="empleadoForm">
      <label for="nameEmployee">Nombre:</label>
      <input type="text" id="nameEmployee" name="nameEmployee" required>
        
      <label for="positionEmployee">Cargo:</label>
      <input type="text" id="positionEmployee" name="positionEmployee" required>

      <label for="cedEmployee">Identificación:</label>
      <input type="text" id="cedEmployee" name="cedEmployee" required>

      <label for="dirEmployee">Dirección:</label>
      <input type="text" id="dirEmployee" name="dirEmployee" required>

      <label for="telEmpployee">Teléfono:</label>
      <input type="tel" id="telEmpployee" name="telEmpployee" required>

      <button class="Guardar" type="submit">Guardar</button>
    </form>
    <div class="mensajee" id="mensaje"></div>
  </div>

  <script src="crear-empleados.js"></script>
</body>
</html>
